  <script>
    // motyw przed renderem (bez mignięcia)
    try {
      const s = JSON.parse(localStorage.getItem('oif:theme') || 'null');
      if (s) {
        const t = s.theme === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : s.theme;
        document.documentElement.dataset.theme = t || 'dark';
        document.documentElement.dataset.accent = s.accent || 'violet';
        if (s.density) document.documentElement.dataset.density = s.density;
      }
    } catch (e) {}
  </script>

    #boot .b-logo { width: 54px; height: 54px; border-radius: 16px; display: grid; place-items: center; margin: 0 auto 16px;

    #boot .b-text { color: var(--muted); font: 500 13px var(--font); text-align: center; }
    @keyframes bpulse { 50% { transform: scale(1.06); } }
  </style>
